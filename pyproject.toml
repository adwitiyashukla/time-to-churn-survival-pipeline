[project]
name = "time-to-churn-survival-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=12.0",
    "scikit-learn>=1.3",
    "lifelines>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["churn_survival"]

[tool.pytest.ini_options]
testpaths = ["tests"]
